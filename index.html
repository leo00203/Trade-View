<script>
// ============== WIDGET SYSTEM ==============
let widgets = JSON.parse(localStorage.getItem("customWidgets") || "[]");

function renderWidgets() {
  const container = document.getElementById("widgets");
  container.innerHTML = "";

  widgets.forEach((widget, index) => {
    const box = document.createElement("div");
    box.className = "widget";
    box.innerHTML = `
      <h3>${widget.name}</h3>
      <div style="margin-bottom:10px;">
        <button onclick="loadWidget(${index})">▶ Laden / Aktualisieren</button>
        <button onclick="deleteWidget(${index})" style="margin-left:8px; background:#c62828;">🗑 Löschen</button>
      </div>
      <div class="output" id="output-${index}"></div>
    `;
    container.appendChild(box);
  });
}

function addWidget() {
  const name = document.getElementById("widgetName").value.trim();
  const code = document.getElementById("widgetCode").value.trim();

  if (!name || !code) {
    alert("Bitte sowohl Namen als auch Code eingeben!");
    return;
  }

  widgets.push({ name, code });
  localStorage.setItem("customWidgets", JSON.stringify(widgets));

  document.getElementById("widgetName").value = "";
  document.getElementById("widgetCode").value = "";

  renderWidgets();
}

function loadWidget(index) {
  const output = document.getElementById(`output-${index}`);
  const rawCode = widgets[index].code.trim();
  
  output.innerHTML = '<p style="color:#888; font-style:italic;">Lade Widget...</p>';

  try {
    // 1. Enthält HTML-Tags → direkt als HTML rendern (TradingView, iframe, X-Post, etc.)
    if (rawCode.includes("<") && (rawCode.includes(">") || rawCode.startsWith("http"))) {
      
      // Speziell für TradingView und Twitter/X
      if (rawCode.includes("tradingview") || rawCode.includes("twitter") || rawCode.includes("x.com")) {
        output.innerHTML = rawCode;
        
        // Scripts neu laden (wichtig für TradingView & Twitter)
        const scripts = output.querySelectorAll("script");
        scripts.forEach(oldScript => {
          const newScript = document.createElement("script");
          if (oldScript.src) {
            newScript.src = oldScript.src;
          } else {
            newScript.textContent = oldScript.textContent;
          }
          document.body.appendChild(newScript);
        });
        return;
      }
      
      // Normales HTML / iframe
      output.innerHTML = rawCode;
      return;
    }

    // 2. JSON Daten
    if ((rawCode.startsWith("{") && rawCode.endsWith("}")) || 
        (rawCode.startsWith("[") && rawCode.endsWith("]"))) {
      try {
        const jsonData = JSON.parse(rawCode);
        output.innerHTML = `<pre style="background:#0a0a0a; padding:15px; border-radius:8px; overflow:auto; max-height:600px; color:#0f0;">${JSON.stringify(jsonData, null, 2)}</pre>`;
        return;
      } catch(e) {}
    }

    // 3. Reiner JavaScript Code
    output.innerHTML = "";
    const func = new Function("output", rawCode);
    func((content) => {
      if (typeof content === "string") {
        output.innerHTML = content;
      } else {
        output.innerHTML = "<pre>" + JSON.stringify(content, null, 2) + "</pre>";
      }
    });

  } catch (error) {
    console.error(error);
    output.innerHTML = `
      <span style="color:#ff5252;">
        ❌ Fehler: ${error.message}<br><br>
        <small>Tipp: Bei Embed-Codes (TradingView, X, iframe) einfach den kompletten Code einfügen.</small>
      </span>`;
  }
}

function deleteWidget(index) {
  if (confirm("Dieses Widget wirklich löschen?")) {
    widgets.splice(index, 1);
    localStorage.setItem("customWidgets", JSON.stringify(widgets));
    renderWidgets();
  }
}

// Seite initial laden
renderWidgets();
</script>
